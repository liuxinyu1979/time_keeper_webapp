{% extends "base.html" %}
{% block title %}Graphs{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">Graphs</li>
      <li class="breadcrumb-item active" aria-current="page">{{graph_url_name}}</li>
    </ol>
  </nav>


<div class="container-fluid">
    <div class="row-fluid mt-md-n5">
        {% for r in admin_action_graphs  | batch( cols, '&nbsp;') %}
        <tr>
        {% for column in r %}
        <td><img src="{{ column }}" alt="my plot"></td>
        {% endfor %}
        </tr>
        <br/>
        <br/>
        {% endfor %}
    </div>
</div>
{% endblock %}
